# Build, test and upload daemonflux to PyPI when a GitHub release is published.
# Uploads use PyPI trusted publishing (OIDC): no API token is stored in the
# repository. The PyPI publisher is registered for this workflow file and the
# "pypi" environment.

name: Build, Test and Upload daemonflux

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Install package and deps
      run: python -m pip install --prefer-binary -v .[test]
    - name: Run tests
      run: pytest -vv
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
